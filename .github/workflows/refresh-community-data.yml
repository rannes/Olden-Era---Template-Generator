name: Refresh community data

# Weekly mirror of the alcaras/homm-olden datamine into
# src/OldenEra.Generator/CommunityData/. If catalog files change, the workflow
# opens a PR against main; the repo's existing tests workflow runs against
# the PR. See README "Refreshing community data" for manual usage.

on:
  schedule:
    # Mondays at 08:00 UTC — low-traffic window.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run fetch script
        id: fetch
        run: |
          python3 src/OldenEra.Generator/CommunityData/scripts/fetch-from-alcaras.py

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet src/OldenEra.Generator/CommunityData/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No catalog changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            FILES=$(git diff --name-only src/OldenEra.Generator/CommunityData/ | wc -l | tr -d ' ')
            LINES=$(git diff --shortstat src/OldenEra.Generator/CommunityData/ || true)
            echo "files=$FILES" >> "$GITHUB_OUTPUT"
            {
              echo 'shortstat<<EOF'
              echo "$LINES"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve upstream commit
        if: steps.diff.outputs.changed == 'true'
        id: upstream
        run: |
          SHA=$(curl -fsSL https://api.github.com/repos/alcaras/homm-olden/commits/master \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['sha'])")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/alcaras/homm-olden/commit/$SHA" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/community-data-refresh
          branch-suffix: timestamp
          delete-branch: true
          commit-message: |
            chore: refresh community data from alcaras/homm-olden

            Mirrors upstream ${{ steps.upstream.outputs.sha }}.
          title: 'chore: refresh community data from alcaras/homm-olden'
          body: |
            Automated weekly refresh of bundled community data from
            [alcaras/homm-olden](https://github.com/alcaras/homm-olden).

            **Upstream commit:** ${{ steps.upstream.outputs.url }}

            **Diff summary:**
            - Files changed: ${{ steps.diff.outputs.files }}
            - ${{ steps.diff.outputs.shortstat }}

            The repo's `tests` workflow runs against this PR. If tests pass, the
            PR is reviewable as-is. If they fail, the data shape likely shifted
            upstream and the C# loaders or `SidCatalog` need a follow-up — do
            not merge until that's resolved.

            Generated by `.github/workflows/refresh-community-data.yml`.
          labels: |
            community-data
            automated
